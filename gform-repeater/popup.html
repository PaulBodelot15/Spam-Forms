<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>GForm Repeater</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 230px;
      padding: 18px 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      background: #1e1e2e;
      color: #cdd6f4;
    }

    h2 {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .04em;
      color: #cba6f7;
      margin-bottom: 12px;
      text-transform: uppercase;
    }

    p {
      color: #a6adc8;
      font-size: 12px;
      line-height: 1.65;
    }

    .step {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .num {
      flex-shrink: 0;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #313244;
      color: #cba6f7;
      font-size: 11px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .step p { color: #bac2de; }
  </style>
</head>
<body>
  <h2>GForm Repeater</h2>

  <div class="step">
    <span class="num">1</span>
    <p>Remplissez le formulaire normalement.</p>
  </div>
  <div class="step">
    <span class="num">2</span>
    <p>Cliquez sur le bouton <strong>Envoyer</strong> natif.</p>
  </div>
  <div class="step">
    <span class="num">3</span>
    <p>Saisissez le nombre de répétitions dans la boîte de dialogue.</p>
  </div>
</body>
</html>
