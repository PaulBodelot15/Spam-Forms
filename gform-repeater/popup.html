<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>GForm Repeater</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 230px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      background: #1e1e2e;
      color: #cdd6f4;
    }

    h2 {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .04em;
      color: #cba6f7;
      margin-bottom: 14px;
      text-transform: uppercase;
    }

    label {
      display: block;
      color: #a6adc8;
      margin-bottom: 4px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .05em;
    }

    input[type="number"] {
      width: 100%;
      padding: 6px 9px;
      background: #313244;
      border: 1px solid #45475a;
      border-radius: 5px;
      color: #cdd6f4;
      font-size: 13px;
      margin-bottom: 11px;
      outline: none;
      transition: border-color .15s;
    }
    input[type="number"]:focus { border-color: #cba6f7; }

    button {
      width: 100%;
      padding: 8px;
      border: none;
      border-radius: 5px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .15s;
    }
    button:disabled { opacity: .4; cursor: not-allowed; }

    #launch-btn  { background: #cba6f7; color: #1e1e2e; }
    #launch-btn:not(:disabled):hover { opacity: .88; }

    #stop-btn {
      background: #f38ba8;
      color: #1e1e2e;
      margin-top: 10px;
    }
    #stop-btn:not(:disabled):hover { opacity: .88; }

    /* ── progress section ── */
    #progress-section { display: none; }

    #progress-label {
      font-size: 12px;
      color: #a6e3a1;
      margin-bottom: 5px;
      font-weight: 600;
    }

    #progress-track {
      height: 7px;
      background: #313244;
      border-radius: 99px;
      overflow: hidden;
    }

    #progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #a6e3a1, #94e2d5);
      border-radius: 99px;
      transition: width .3s ease;
    }

    #status {
      font-size: 11px;
      color: #6c7086;
      margin-top: 6px;
    }
    #status.done { color: #a6e3a1; }

    #error {
      color: #f38ba8;
      font-size: 11px;
      margin-top: 9px;
      min-height: 15px;
    }
  </style>
</head>
<body>
  <h2>GForm Repeater</h2>

  <div id="form-section">
    <label for="count">Répétitions</label>
    <input type="number" id="count" min="1" max="10000" value="5">

    <label for="delay">Délai entre envois (ms)</label>
    <input type="number" id="delay" min="0" max="300000" value="1000">

    <button id="launch-btn">Lancer</button>
  </div>

  <div id="progress-section">
    <div id="progress-label">0 / 0</div>
    <div id="progress-track"><div id="progress-fill"></div></div>
    <div id="status">En cours…</div>
    <button id="stop-btn">Arrêter</button>
  </div>

  <div id="error"></div>

  <script src="popup.js"></script>
</body>
</html>
